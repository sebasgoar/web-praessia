<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Admin Praessia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <link href="/admin/admin-common.css" rel="stylesheet">
</head>

<body>
    <header class="main-header">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col-auto">
                    <img src="/assets/img/imagotipo.svg" alt="Praessia logo" class="logo">
                </div>
                <div class="col">
                    <nav class="nav-container">
                        <ul class="nav-menu">
                            <li><a href="/">Inicio</a></li>
                            <li><a href="/store">Tienda</a></li>
                            <li><a href="/about-us/">¿Quiénes somos?</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <div id="loginScreen">
        <div class="login-box">
            <p class="login-logo">PRAESSIA</p>
            <p class="login-subtitle">Panel de administración</p>

            <div class="login-field">
                <i class="bi bi-person"></i>
                <input type="text" id="loginUser" class="login-input" placeholder="Usuario" autocomplete="username">
            </div>
            <div class="login-field">
                <i class="bi bi-lock"></i>
                <input type="password" id="loginInput" class="login-input" placeholder="Contraseña" autocomplete="current-password">
            </div>

            <button class="btn-login" id="btnLogin">
                Ingresar
            </button>

            <p class="login-error" id="loginError">
                <i class="bi bi-exclamation-circle me-1"></i>Contraseña incorrecta
            </p>
        </div>
    </div>

    <div class="admin-toast" id="adminToast"></div>

    <script>
        (function() {
            const isLocal = ['localhost', '127.0.0.1', ''].includes(window.location.hostname) || window.location.protocol === 'file:';
            window.__BACKEND_BASE__ = isLocal ? 'http://localhost:3008' : '/api';
        })();
    </script>
    <script src="/data-perfumes.js"></script>
    <script src="/admin/admin-backend.js"></script>
    <script src="/admin/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('authToken');
            if (token) {
                try {
                    const isLocal = ['localhost', '127.0.0.1', ''].includes(window.location.hostname) || window.location.protocol === 'file:';
                    const base = window.__BACKEND_BASE__ || (isLocal ? 'http://localhost:3008' : '/api');
                    const res = await fetch(base + '/login/check', {
                        headers: { 'Authorization': 'Bearer ' + token },
                        credentials: 'include'
                    });
                    if (res.ok) {
                        window.location.href = '/admin/dashboard/';
                    }
                } catch (e) {}
            }
        });
    </script>
</body>

</html>
