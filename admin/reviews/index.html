<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reseñas — Admin Praessia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <link href="/admin/admin-common.css" rel="stylesheet">
</head>

<body>
    <header class="main-header">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col-auto">
                    <img src="/assets/img/imagotipo.svg" alt="Praessia logo" class="logo">
                </div>
                <div class="col">
                    <nav class="nav-container">
                        <ul class="nav-menu">
                            <li><a href="/">Inicio</a></li>
                            <li><a href="/store">Tienda</a></li>
                            <li><a href="/about-us/">¿Quiénes somos?</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <div id="adminPanel">
        <div class="admin-layout">
            <aside class="admin-sidebar">
                <div class="sidebar-brand">
                    <div class="sidebar-brand-name">PRAESSIA</div>
                    <div class="sidebar-brand-sub">Admin</div>
                </div>

                <nav class="sidebar-nav">
                    <div class="nav-section-label">General</div>
                    <a class="sidebar-link" href="/admin/dashboard/">
                        <i class="bi bi-grid-1x2"></i> Dashboard
                    </a>

                    <div class="nav-section-label">Inventario</div>
                    <a class="sidebar-link" href="/admin/inventory/">
                        <i class="bi bi-boxes"></i> Stock insumos
                    </a>
                    <a class="sidebar-link" href="/admin/production/">
                        <i class="bi bi-droplet"></i> Producción
                    </a>
                    <a class="sidebar-link" href="/admin/supply-recharge/">
                        <i class="bi bi-arrow-repeat"></i> Recargar insumos
                    </a>

                    <div class="nav-section-label">Ventas</div>
                    <a class="sidebar-link" href="/admin/record-sale/">
                        <i class="bi bi-bag-check"></i> Registrar venta
                    </a>
                    <a class="sidebar-link" href="/admin/history/">
                        <i class="bi bi-clock-history"></i> Historial
                    </a>

                    <div class="nav-section-label">Tienda</div>
                    <a class="sidebar-link" href="/admin/products/">
                        <i class="bi bi-flower1"></i> Catálogo / Productos
                    </a>
                    <a class="sidebar-link active" href="/admin/reviews/">
                        <i class="bi bi-chat-heart"></i> Reseñas
                        <span class="sidebar-badge" id="pendingBadge" style="display:none">0</span>
                    </a>
                </nav>

                <div class="sidebar-footer">
                    <button class="btn-logout" id="btnLogout">
                        <i class="bi bi-box-arrow-left"></i> Cerrar sesión
                    </button>
                </div>
            </aside>

            <main class="admin-main">
                <div class="admin-topbar">
                    <span class="topbar-title">Reseñas</span>
                    <span class="topbar-date" id="topbarDate"></span>
                </div>

                <div class="admin-content">
                    <section class="admin-section active" id="section-resenias">
                        <div class="admin-table-wrap" style="margin-bottom:24px;">
                            <div class="admin-table-header">
                                <span class="admin-table-title">
                                    <i class="bi bi-hourglass me-2" style="color:var(--yellow);"></i>
                                    Reseñas pendientes
                                </span>
                                <span id="pendingCount" style="font-size:0.82rem; color:var(--muted);"></span>
                            </div>
                            <div id="pendingReviewsList" style="padding: 8px 0;">
                                <div class="empty-state">
                                    <i class="bi bi-chat-heart"></i>
                                    No hay reseñas pendientes
                                </div>
                            </div>
                        </div>

                        <div class="admin-table-wrap">
                            <div class="admin-table-header">
                                <span class="admin-table-title">
                                    <i class="bi bi-check-circle me-2" style="color:var(--green);"></i>
                                    Reseñas publicadas
                                </span>
                            </div>
                            <div id="approvedReviewsList" style="padding: 8px 0;">
                                <div class="empty-state">
                                    <i class="bi bi-chat"></i>
                                    Sin reseñas publicadas aún
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <div class="admin-toast" id="adminToast"></div>

    <script>
        (function() {
            const isLocal = ['localhost', '127.0.0.1', ''].includes(window.location.hostname) || window.location.protocol === 'file:';
            window.__BACKEND_BASE__ = isLocal ? 'http://localhost:3008' : '/api';
        })();
    </script>
    <script src="/data-perfumes.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getFirestore,
            collection, doc,
            addDoc, getDoc, getDocs, updateDoc, deleteDoc, setDoc,
            query, where, orderBy, limit,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDjtWzX0ntgyTPrwbgMUtVAfz095t9oEog",
            authDomain: "praessia.firebaseapp.com",
            projectId: "praessia",
            storageBucket: "praessia.firebasestorage.app",
            messagingSenderId: "855337167445",
            appId: "1:855337167445:web:df9dcf35667a179e6302dc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window._adminDB = db;
        window._adminFS = {
            collection, doc,
            addDoc, getDoc, getDocs, updateDoc, deleteDoc, setDoc,
            query, where, orderBy, limit,
            serverTimestamp
        };

        window.dispatchEvent(new Event('adminFirebaseReady'));
    </script>
    <script src="/admin/admin-backend.js"></script>
    <script src="/admin/admin.js"></script>
    <script src="reviews.js"></script>
</body>

</html>
